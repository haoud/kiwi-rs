[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/console",
    "crates/macros",
]

[workspace.dependencies]
console = { path = "crates/console" }
macros = { path = "crates/macros" }

zerocopy = { version = "0.8", features = ["alloc", "derive"] }
arrayvec = { version = "0.7", default-features = false }
usize_cast = "1.1"
bitfield = "0.20.0"
bitflags = "2.11"
log = "0.4"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
pedantic = "warn"
all = "warn"

[dependencies]
usize_cast = { workspace = true }
arrayvec = { workspace = true }
bitfield = { workspace = true }
bitflags = { workspace = true }
zerocopy = { workspace = true }
console = { workspace = true, optional = true }
macros = { workspace = true }
log = { workspace = true }

# Until we implement a slub allocator
linked_list_allocator = { version = "0.10", default-features = false }

# Scancode decoding and keyboard layouts
pc-keyboard = "0.9"

# Do not upgrade this dependency to a version >= 0.5.0, as the API has changed
# and is now shitty to use without any specified reason.
[target.'cfg(target_arch = "x86_64")'.dependencies]
limine = { version = "0.5" }

[features]
default = ["logging"]
logging = []

# The debug console on the framebuffer, with its text user interface. It is
# meant to debug the kernel and is not included by default to keep release
# builds small: use `make build-debug` or `make run-debug` to enable it.
debug-console = ["dep:console"]

[lints]
workspace = true

[profile.release]
codegen-units = 1
opt-level = 3
strip = true
lto = true
